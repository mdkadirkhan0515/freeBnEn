import org.apache.tools.ant.taskdefs.condition.Os

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // For RN 0.73.6 - Do NOT set entryFile as String
    // New plugin uses RegularFile, keep default
    // If you need custom, use: entryFile = file("../../index.js")
}

def enableHermes = project.ext.react.get("enableHermes", false)
def enableNewArch = false // Must false for sqlite-storage + tts + MMKV

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.wordlearning.app"
    defaultConfig {
        applicationId "com.wordlearning.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        resValue "string", "app_name", "শব্দ"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst '**/libjsc.so'
        pickFirst '**/libc++_shared.so'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"
    debugImplementation "com.facebook.flipper:flipper:${FLIPPER_VERSION}"
    debugImplementation "com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}" {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }
    debugImplementation "com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}"
    if (enableHermes) {
        def hermesPath = "../../node_modules/hermes-engine/"
        debugImplementation files(hermesPath + "android/hermes-debug.aar")
        releaseImplementation files(hermesPath + "android/hermes-release.aar")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
