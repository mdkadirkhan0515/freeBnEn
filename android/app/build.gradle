import org.apache.tools.ant.taskdefs.condition.Os

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    entryFile = "index.js"
}

def enableHermes = project.ext.react.get("enableHermes", false)
def enableNewArch = false // Must false for sqlite-storage + tts

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.wordlearning.app"
    defaultConfig {
        applicationId "com.wordlearning.app"
        minSdkVersion rootProject.ext.minSdkVersion // 24
        targetSdkVersion rootProject.ext.targetSdkVersion // 34
        versionCode 1
        versionName "1.0.0"
        // Short name: শব্দ
        resValue "string", "app_name", "word"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug // For APK testing, use debug keystore
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // Hermes + No New Arch = Perfect for MMKV + SQLite + TTS
            hermesEnabled true
        }
    }

    // Fix for vector icons + tts
    packagingOptions {
        pickFirst '**/libjsc.so'
        pickFirst '**/libc++_shared.so'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"
    debugImplementation "com.facebook.flipper:flipper:${FLIPPER_VERSION}"
    debugImplementation "com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}" {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }
    debugImplementation "com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}"
    if (enableHermes) {
        def hermesPath = "../../node_modules/hermes-engine/"
        debugImplementation files(hermesPath + "android/hermes-debug.aar")
        releaseImplementation files(hermesPath + "android/hermes-release.aar")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
